<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>人教版 PEP 英语 三年级 · 教材结构</title>
<style>
:root{
  --bg:#fbfbf9; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b66;
  --line:#e6e4dd; --accent:#1f6f5c; --accent-soft:#e8f2ee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);padding:22px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand h1{font-size:15px;margin:0 0 4px;letter-spacing:.02em}
.brand p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.tabs{display:flex;gap:6px;padding:0 16px 14px}
.tab{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;
  padding:7px 0;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
nav{padding:0 10px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;
  padding:8px 10px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.35}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent-soft);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav button small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
nav .sec{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:14px 10px 6px;text-transform:uppercase}
main{padding:34px 44px 80px;max-width:960px}
.head{display:flex;align-items:flex-start;gap:26px;justify-content:space-between;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}
.head .idx{font-size:12px;color:var(--accent);letter-spacing:.12em;font-weight:600}
.head h2{margin:4px 0 2px;font-size:27px;letter-spacing:-.01em;line-height:1.2}
.head .zh{color:var(--muted);font-size:14px}
.bigq{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:13px 18px;max-width:420px}
.bigq span{font-size:11px;color:var(--muted);letter-spacing:.1em;display:block;margin-bottom:3px}
.bigq b{font-size:17px;font-weight:600;line-height:1.35;display:block}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.chip{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px}
section.part{margin-bottom:34px}
.parthead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.parthead h3{margin:0;font-size:16px;letter-spacing:.02em}
.parthead .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.parthead .tag.opt{background:#f6f1e3;color:#8a6d1f}
.q{color:var(--muted);font-size:14px;margin:0 0 12px}
.q b{color:var(--ink);font-weight:600}
.fn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fn span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 9px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em;
  border-bottom:1px solid var(--line);padding:7px 10px}
td{border-bottom:1px solid #f0eee8;padding:9px 10px;vertical-align:top}
td.en{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}
td.zh{color:var(--muted);width:40%}
tr:hover td{background:#fcfcf9}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px}
.rule h4{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:var(--accent)}
.rule .pair{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
.rule .pair code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.chant{margin:12px 0 0;font-size:13px;color:var(--muted);font-style:italic;line-height:1.7}
ol.check{margin:0;padding-left:20px;font-size:14px}
ol.check li{margin-bottom:6px}
.vfilter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.vfilter button{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:4px 12px;cursor:pointer;color:var(--muted)}
.vfilter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.lv{font-size:10.5px;font-weight:600;border-radius:4px;padding:1.5px 6px;white-space:nowrap}
.lv.y{background:#e2efe9;color:#16604f}
.lv.n{background:#f2f1ec;color:#7d7d75}
.ipa{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.pg{font-size:11.5px;color:var(--muted);white-space:nowrap}
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:0 0 14px;isolation:isolate}
.searchbox input{width:100%;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);outline:none}
.searchbox input:focus{border-color:var(--accent)}
.hits{position:absolute;left:0;right:0;top:calc(100% - 6px);z-index:30;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 28px rgba(0,0,0,.08);max-height:62vh;overflow:auto;padding:6px}
.hits.on{display:block}
.hit{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid #f0eee8;padding:9px 10px;font:inherit;font-size:13.5px;cursor:pointer;border-radius:6px}
.hit:hover{background:var(--accent-soft)}
.hit .u{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.hit .empty{color:var(--muted)}
.empty{padding:14px;color:var(--muted);font-size:13px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:22px 18px 60px}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">
      <h1>人教版 PEP · 三年级</h1>
      <p id="edition"></p>
    </div>
    <div class="tabs" id="tabs"></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜索单词、句型或中文（如 giraffe / 长颈鹿 / 你叫什么）"/>
      <div class="hits" id="hits"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

const S = {book: 0, unit: 0, filter: "all"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cur = () => DATA.books[S.book];
const lvLabel = l => l === "运用"
  ? '<span class="lv y">要会用</span>' : '<span class="lv n">认得即可</span>';

function renderTabs(){
  const el = $("#tabs");
  el.innerHTML = DATA.books.map((b,i) =>
    `<button class="tab" role="tab" aria-selected="${i===S.book}" data-b="${i}">${b.label}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => btn.onclick = () => { switchBook(+btn.dataset.b); });
  $("#edition").textContent = cur().edition + " · " + cur().pages + " 页";
}

function switchBook(i){
  S.book = i; S.unit = 0; S.filter = "all";
  $("#q").value = ""; $("#hits").classList.remove("on");
  renderTabs(); renderNav(); renderView(); window.scrollTo({top:0});
}

function renderNav(){
  const b = cur();
  const items = [["sec","单元"]];
  const list = [];
  b.units.forEach((u,i) => list.push(
    `<button data-u="${i}" aria-current="${i===S.unit}">Unit ${u.n}　${esc(u.tEn)}<small>${esc(u.tZh)}</small></button>`));
  let h = '<div class="sec">单元</div>' + list.join("") +
    '<div class="sec">复习与附录</div>' +
    `<button data-u="rev" aria-current="${S.unit==='rev'}">Revision<small>${esc(b.revision.title_zh)}</small></button>` +
    `<button data-u="app" aria-current="${S.unit==='app'}">附录<small>歌曲 · 词表 · 表达 · 语音</small></button>`;
  const nav = $("#nav");
  nav.innerHTML = h;
  nav.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    const v = btn.dataset.u;
    S.unit = (v === "rev" || v === "app") ? v : +v;
    S.filter = "all";
    renderNav(); renderView(); window.scrollTo({top:0});
  });
}

function sentenceTable(list){
  return `<table><thead><tr><th>English</th><th>中文</th></tr></thead><tbody>` +
    list.map(x => `<tr><td class="en">${esc(x.en)}</td><td class="zh">${esc(x.zh)}</td></tr>`).join("") +
    `</tbody></table>`;
}

function vocabBlock(u){
  const rows = u.vocab.filter(v => S.filter === "all" ||
    (S.filter === "y" ? v.level === "运用" : v.level !== "运用"));
  const y = u.vocab.filter(v => v.level === "运用").length;
  const n = u.vocab.length - y;
  return `<section class="part">
    <div class="parthead"><h3>词汇</h3><span class="tag">${u.vocab.length} 词</span></div>
    <div class="vfilter">
      <button data-f="all" aria-pressed="${S.filter==='all'}">全部 ${u.vocab.length}</button>
      <button data-f="y" aria-pressed="${S.filter==='y'}">要会用 ${y}</button>
      <button data-f="n" aria-pressed="${S.filter==='n'}">认得即可 ${n}</button>
    </div>
    <table><thead><tr><th>单词</th><th>音标</th><th>释义</th><th>页</th><th>掌握</th></tr></thead><tbody>` +
    rows.map(v => `<tr><td><b>${esc(v.word)}</b></td><td class="ipa">${esc(v.ipa)}</td>
      <td class="zh">${esc(v.zh)}</td><td class="pg">p.${v.page}</td><td>${lvLabel(v.level)}</td></tr>`).join("") +
    `</tbody></table></section>`;
}

function renderUnit(){
  const u = cur().units[S.unit];
  let h = `<div class="head">
    <div>
      <div class="idx">UNIT ${u.n}　·　p.${u.pages[0]}–${u.pages[1]}</div>
      <h2>${esc(u.tEn)}</h2>
      <div class="zh">${esc(u.tZh)}</div>
    </div>
    <div class="bigq"><span>单元大问题</span><b>${esc(u.bigQ)}</b></div>
  </div>
  <div class="meta">
    <span class="chip">歌曲　${esc(u.song || "—")}</span>
    <span class="chip">项目　${esc(u.project)}</span>
    <span class="chip">Reading time　${esc(u.reading)}</span>
  </div>`;

  h += `<section class="part">
    <div class="parthead"><h3>Part A</h3><span class="tag">必学</span></div>
    <p class="q">驱动问题：<b>${esc(u.A.q)}</b></p>
    <div class="fn">${u.A.fn.map(f => `<span>${esc(f)}</span>`).join("")}</div>
    ${sentenceTable(u.A.s)}
  </section>`;

  if (u.phonics){
    h += `<section class="part"><div class="rule">
      <h4>Letters and sounds　字母与音素</h4>
      <table><thead><tr><th>字母</th><th>音素</th><th>例词</th></tr></thead><tbody>` +
      u.phonics.map(p => `<tr><td><b>${esc(p.letter)}</b></td><td class="ipa">${esc(p.sound)}</td>
        <td>${p.examples.map(e => `<code>${esc(e)}</code>`).join(" ")}</td></tr>`).join("") +
      `</tbody></table></div></section>`;
  }
  if (u.spell){
    h += `<section class="part"><div class="rule">
      <h4>Let's spell　拼读规则</h4>
      <p style="margin:0;font-size:14px">${esc(u.spell.rule)}</p>
      <div class="pair">${u.spell.contrast.map(w => `<code>${esc(w)}</code>`).join("")}</div>
      <p class="chant">“${esc(u.spell.chant)}”</p></div></section>`;
  }

  h += `<section class="part">
    <div class="parthead"><h3>Part B</h3><span class="tag">必学</span></div>
    <p class="q">驱动问题：<b>${esc(u.B.q)}</b></p>
    <div class="fn">${u.B.fn.map(f => `<span>${esc(f)}</span>`).join("")}</div>
    ${sentenceTable(u.B.s)}
  </section>`;

  h += `<section class="part">
    <div class="parthead"><h3>Part C</h3><span class="tag opt">选学</span></div>
    <div class="rule" style="margin-bottom:14px">
      <h4>Project　项目</h4><p style="margin:0;font-size:14px">${esc(u.project)}</p></div>
    <div class="rule" style="margin-bottom:14px">
      <h4>Self-check　自评</h4>
      <ol class="check">${u.check.map(c => `<li>${esc(c)}</li>`).join("")}</ol></div>
    <div class="rule">
      <h4>Reading time　拓展阅读</h4><p style="margin:0;font-size:14px">${esc(u.reading)}</p></div>
  </section>`;

  return h + vocabBlock(u);
}

function renderRevision(){
  const r = cur().revision;
  const pg = r.pages ? `p.${r.pages[0]}–${r.pages[1]}` : "";
  return `<div class="head"><div>
      <div class="idx">REVISION　·　${pg}</div>
      <h2>${esc(r.title_en)}</h2><div class="zh">${esc(r.title_zh)}</div></div>
      <div class="bigq"><span>定位</span><b>综合复习，不引入新语言</b></div></div>
    <section class="part"><div class="parthead"><h3>活动</h3></div>
      <ol class="check">${r.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ol></section>
    <section class="part"><div class="parthead"><h3>复现的语言</h3></div>
      <div class="fn">${r.recycles.map(t => `<span>${esc(t)}</span>`).join("")}</div></section>`;
}

function renderAppendix(){
  const a = cur().appendices;
  return `<div class="head"><div><div class="idx">APPENDIX</div><h2>附录</h2>
      <div class="zh">歌曲 · 词表 · 常用表达 · 语音</div></div></div>
    <table><thead><tr><th>编号</th><th>名称</th><th>页码</th><th>内容</th></tr></thead><tbody>` +
    a.map(x => `<tr><td class="pg">${esc(x.id)}</td><td><b>${esc(x.name)}</b></td>
      <td class="pg">${esc(x.pages)}</td><td class="zh">${esc(x.note)}</td></tr>`).join("") +
    `</tbody></table>`;
}

function renderView(){
  const v = $("#view");
  if (S.unit === "rev") v.innerHTML = renderRevision();
  else if (S.unit === "app") v.innerHTML = renderAppendix();
  else v.innerHTML = renderUnit();
  v.querySelectorAll(".vfilter button").forEach(btn => btn.onclick = () => {
    S.filter = btn.dataset.f; renderView();
  });
}

function search(q){
  const box = $("#hits");
  q = q.trim().toLowerCase();
  if (!q){ box.classList.remove("on"); box.innerHTML = ""; return; }
  const out = [];
  for (const b of DATA.books){
    for (const u of b.units){
      for (const v of u.vocab){
        if (v.word.toLowerCase().includes(q) || v.zh.includes(q)){
          out.push(`<button class="hit" data-b="${b.id}" data-u="${u.n}"><b>${esc(v.word)}</b>
            <span class="ipa">${esc(v.ipa)}</span><span>${esc(v.zh)}</span>${lvLabel(v.level)}
            <span class="u">${b.label} U${u.n}</span></button>`);
        }
      }
      for (const part of ["A","B"]){
        for (const s of u[part].s){
          if (s.en.toLowerCase().includes(q) || s.zh.includes(q)){
            out.push(`<button class="hit" data-b="${b.id}" data-u="${u.n}">
              <span class="en">${esc(s.en)}</span>
              <span class="u">${b.label} U${u.n} · Part ${part}</span></button>`);
          }
        }
      }
    }
  }
  box.innerHTML = out.length
    ? out.slice(0, 60).join("")
    : `<div class="empty">没有匹配「${esc(q)}」</div>`;
  box.classList.add("on");
  box.querySelectorAll(".hit").forEach(el => el.onclick = () => {
    const bi = DATA.books.findIndex(x => x.id === el.dataset.b);
    S.book = bi; S.unit = +el.dataset.u - 1; S.filter = "all";
    $("#q").value = ""; box.classList.remove("on"); box.innerHTML = "";
    renderTabs(); renderNav(); renderView(); window.scrollTo({top:0});
  });
}

$("#q").addEventListener("input", e => search(e.target.value));
$("#q").addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.target.value = ""; search(""); e.target.blur(); }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".searchbox")) $("#hits").classList.remove("on");
});

renderTabs();
renderNav();
renderView();
</script>
</body>
</html>
